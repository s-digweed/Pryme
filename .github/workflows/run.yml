name: Amazon Prime EPG

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          sudo apt-get update
          sudo apt-get install -y wireguard-tools

      - name: Connect Proton (US)
        run: |
          printf '%s\n' "${{ secrets.PROTON_WG }}" \
            | grep -v '^DNS' \
            | sed -E '/^Address/ s/,.*//; /^AllowedIPs/ s/,.*//' \
            | sudo tee /etc/wireguard/wg0.conf >/dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf
          sudo wg-quick up wg0
          sudo wg show wg0
          echo "Exit country: $(curl -s https://ipinfo.io/country)"

      - name: Run scraper
        run: python amazon_epg.py

      - name: Disconnect Proton
        if: always()
        run: sudo wg-quick down wg0 || true

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add amazon_epg.xml amazon_epg_state.json.gz
          git commit -m "Update Amazon EPG" || echo "No changes to commit"
          git push
