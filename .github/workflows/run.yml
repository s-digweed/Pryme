name: Run Pryme (Amazon EPG)
permissions:
  contents: write

on:
  schedule:
    - cron: '0 2 * * *'   # daily 02:00 UTC (05:00 KSA)
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pysocks

      - name: Run amazon_epg.py
        run: python amazon_epg.py

      - name: Commit EPG
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add amazon_epg.xml
          git commit -m "Update Amazon EPG - $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No changes"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
