name: Run Pryme (Amazon EPG)
permissions:
  contents: write

on:
  schedule:
    - cron: '0 2 * * *'   # daily 02:00 UTC (05:00 KSA) — one clean run is enough now
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests
          sudo apt-get update
          sudo apt-get install -y wireguard-tools

      - name: Connect Proton (US)
        run: |
          printf '%s\n' "${{ secrets.PROTON_WG }}" \
            | grep -v '^DNS' \
            | sed -E '/^Address/ s/,.*//; /^AllowedIPs/ s/,.*//' \
            | sudo tee /etc/wireguard/wg0.conf >/dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf
          sudo wg-quick up wg0
          echo "Exit country: $(curl -s https://ipinfo.io/country)"

      - name: Run amazon_epg.py
        run: python amazon_epg.py

      - name: Disconnect Proton
        if: always()
        run: sudo wg-quick down wg0 || true

      - name: Commit EPG
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add amazon_epg.xml amazon_epg_state.json.gz
          git commit -m "Update Amazon EPG - $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No changes"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
